<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #ff0066;
    --secondary: #00ff85;
    --text: #ffffff;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 80px; position: relative; }
  body::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(255,0,102,0.04) 4px, rgba(255,0,102,0.04) 5px);
    pointer-events: none;
  }
  .kicker { font-size: 32px; font-weight: 900; letter-spacing: 0.4em; color: var(--accent); text-transform: uppercase; z-index: 1; }
  .footer { position: absolute; bottom: 60px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; z-index: 1; }
  /* HOOK slide */
  .hook { display: none; flex-direction: column; justify-content: flex-end; align-items: flex-start; flex: 1; gap: 30px; z-index: 1; padding-bottom: 60px; }
  .hook .title { font-size: 120px; font-weight: 900; line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; }
  .hook .title em { font-style: normal; color: var(--accent); }
  .hook .subtitle { font-size: 36px; color: var(--muted); font-weight: 500; }
  body[data-slot="hook"] .hook { display: flex; }
  /* BODY slide — large paragraph of context */
  .body { display: none; flex-direction: column; justify-content: center; flex: 1; z-index: 1; gap: 30px; }
  .body .marker { width: 80px; height: 6px; background: var(--accent); }
  .body .line { font-size: 56px; font-weight: 600; line-height: 1.3; }
  .body .source { font-size: 26px; color: var(--muted); font-style: italic; margin-top: 30px; }
  body[data-slot="body"] .body { display: flex; }
  /* QUESTION slide — the open question */
  .question { display: none; flex-direction: column; justify-content: center; flex: 1; z-index: 1; gap: 30px; }
  .question .label { font-size: 32px; color: var(--secondary); letter-spacing: 0.3em; text-transform: uppercase; font-weight: 900; }
  .question .value { font-size: 100px; font-weight: 900; line-height: 1.05; letter-spacing: -0.01em; }
  body[data-slot="question"] .question { display: flex; }
</style>
</head>
<body data-slot="{{slot}}">
  <div class="kicker">{{kicker}}</div>

  <div class="hook">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="body">
    <div class="marker"></div>
    <div class="line">{{line}}</div>
    <div class="source">{{source}}</div>
  </div>

  <div class="question">
    <div class="label">{{label}}</div>
    <div class="value">{{value}}</div>
  </div>

  <div class="footer">
    <span>{{handle}}</span>
    <span>{{slide_num}}</span>
  </div>
</body>
</html>
