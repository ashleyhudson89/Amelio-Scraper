<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #ff0066;
    --secondary: #00ff85;
    --text: #ffffff;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 80px; position: relative; }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(255,0,102,0.18), transparent 60%);
    pointer-events: none;
  }
  .kicker { font-size: 32px; font-weight: 900; letter-spacing: 0.4em; color: var(--accent); text-transform: uppercase; z-index: 1; }
  .footer { position: absolute; bottom: 60px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; z-index: 1; }
  /* HOOK slide */
  .hook { display: none; flex-direction: column; justify-content: center; align-items: flex-start; flex: 1; gap: 40px; z-index: 1; }
  .hook .title { font-size: 110px; font-weight: 900; line-height: 1.0; letter-spacing: -0.02em; text-transform: uppercase; }
  .hook .title .red { color: var(--accent); }
  .hook .subtitle { font-size: 38px; color: var(--secondary); font-weight: 700; letter-spacing: 0.02em; }
  body[data-slot="hook"] .hook { display: flex; }
  /* BODY slide */
  .body { display: none; flex-direction: column; justify-content: center; flex: 1; z-index: 1; }
  .body .marker { width: 80px; height: 6px; background: var(--accent); margin-bottom: 50px; }
  .body .line { font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
  body[data-slot="body"] .body { display: flex; }
  /* SIGN-OFF slide */
  .signoff { display: none; flex-direction: column; justify-content: center; align-items: flex-start; flex: 1; gap: 30px; z-index: 1; }
  .signoff .title { font-size: 140px; font-weight: 900; line-height: 0.92; text-transform: uppercase; color: var(--accent); }
  .signoff .subtitle { font-size: 40px; color: var(--text); font-weight: 500; }
  body[data-slot="signoff"] .signoff { display: flex; }
</style>
</head>
<body data-slot="{{slot}}">
  <div class="kicker">{{kicker}}</div>

  <div class="hook">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="body">
    <div class="marker"></div>
    <div class="line">{{line}}</div>
  </div>

  <div class="signoff">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="footer">
    <span>{{handle}}</span>
    <span>{{slide_num}}</span>
  </div>
</body>
</html>
