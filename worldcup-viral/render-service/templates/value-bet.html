<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #00ff85;
    --secondary: #ff0066;
    --text: #ffffff;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--text); font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 80px; position: relative; }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(circle at 20% 0%, rgba(0,255,133,0.15), transparent 50%),
                      radial-gradient(circle at 80% 100%, rgba(255,0,102,0.12), transparent 50%);
    pointer-events: none;
  }
  body[data-slot="pick"]::before { background-image: radial-gradient(circle at 50% 100%, rgba(0,255,133,0.18), transparent 60%); }
  .kicker { font-size: 32px; font-weight: 900; letter-spacing: 0.4em; color: var(--accent); text-transform: uppercase; z-index: 1; }
  .footer { position: absolute; bottom: 60px; left: 80px; right: 80px; display: flex; justify-content: space-between; font-size: 22px; color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase; z-index: 1; }
  /* HOOK slide */
  .hook { display: none; flex-direction: column; justify-content: center; align-items: flex-start; flex: 1; gap: 40px; z-index: 1; }
  .hook .title { font-size: 130px; font-weight: 900; line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; }
  .hook .title em { font-style: normal; color: var(--accent); }
  .hook .subtitle { font-size: 36px; color: var(--muted); font-weight: 500; }
  body[data-slot="hook"] .hook { display: flex; }
  /* PICK slide */
  .pick { display: none; flex-direction: column; justify-content: center; flex: 1; z-index: 1; }
  .pick .rank { font-size: 380px; font-weight: 900; line-height: 0.85; color: var(--accent); letter-spacing: -0.04em; }
  .pick .team { font-size: 110px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; margin-top: -30px; }
  .pick .line { font-size: 50px; color: var(--text); font-weight: 600; margin-top: 20px; }
  .pick .odds-block { display: flex; align-items: baseline; gap: 24px; margin-top: 50px; padding-top: 40px; border-top: 4px solid var(--secondary); }
  .pick .odds-label { font-size: 28px; color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase; }
  .pick .odds { font-size: 96px; font-weight: 900; color: var(--secondary); }
  .pick .reason { font-size: 34px; color: var(--text); margin-top: 24px; font-weight: 500; line-height: 1.3; }
  body[data-slot="pick"] .pick { display: flex; }
  /* CTA slide */
  .cta { display: none; flex-direction: column; justify-content: center; align-items: flex-start; flex: 1; gap: 40px; z-index: 1; }
  .cta .title { font-size: 120px; font-weight: 900; line-height: 0.95; text-transform: uppercase; }
  .cta .subtitle { font-size: 44px; color: var(--accent); font-weight: 700; }
  body[data-slot="cta"] .cta { display: flex; }
</style>
</head>
<body data-slot="{{slot}}">
  <div class="kicker">{{kicker}}</div>

  <div class="hook">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="pick">
    <div class="rank">{{rank}}</div>
    <div class="team">{{team}}</div>
    <div class="line">{{line}}</div>
    <div class="odds-block">
      <div class="odds-label">Best price</div>
      <div class="odds">{{odds}}</div>
    </div>
    <div class="reason">{{reason}}</div>
  </div>

  <div class="cta">
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
  </div>

  <div class="footer">
    <span>{{handle}}</span>
    <span>{{slide_num}}</span>
  </div>
</body>
</html>
